<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="center-layout">

    <main class="container">
        <section class="card compact-card">
            <div class="success-banner">
                <div class="success-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h2>Submission Received!</h2>
                <p class="banner-subtext">Thank you for updating your profile details.</p>
            </div>

            <div class="success-content">
                <div class="summary-list">
                    <div class="summary-item">
                        <span class="summary-label">Full Name</span>
                        <span class="summary-value-name" style="display: none;"></span>
                    </div>
                    
                    <div class="summary-item">
                        <span class="summary-label">Email Address</span>
                        <span class="summary-value-email" style="display: none;"></span>
                    </div>

                    <div class="summary-item">
                        <span class="summary-label">Phone Number</span>
                        <span class="summary-value-phone" style="display: none;"></span>
                    </div>

                    <div class="summary-item">
                        <span class="summary-label">Gender</span>
                        <span class="summary-value-gender" style="display: none;"></span>
                    </div>
                </div>

                <div class="success-actions">
                    <a href="index.html" class="submit-btn text-decoration-none">
                        <span>Go Back Home</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
