<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Responsive Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="modal fade" tabindex="-1" id="submit-modal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content custom-modal-content">
                <div class="modal-header custom-modal-header">
                    <h5 class="modal-title">Complete Your Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form>
                    <div class="modal-body custom-modal-body">
                        <div class="form-group-custom">
                            <label for="modal-name">Full Name</label>
                            <input type="text" id="modal-name" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="form-group-custom">
                            <label for="modal-email">Email Address</label>
                            <input type="email" id="modal-email" placeholder="name@example.com" required>
                        </div>

                        <div class="form-group-custom">
                            <label for="modal-phone">Phone Number</label>
                            <input type="tel" id="modal-phone" placeholder="e.g., +1 (555) 000-0000" required>
                        </div>

                        <div class="form-group-custom">
                            <label for="modal-gender">Gender</label>
                            <select id="modal-gender" required>
                                <option value="" disabled selected>Select your gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer custom-modal-footer">
                        <button type="button" class="btn-modal-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="submit-btn">
                            <span>Submit Details</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <main class="container">
        <section class="card">
            <div class="card-image">
                <div class="overlay-gradient"></div>
            </div>
            <div class="card-content">
                <span class="badge">Welcome</span>
                <h1>Ready to take the next step?</h1>
                <p>Join thousands of creators who have already upgraded their workflow. Click below to get set up in minutes.</p>
                
                <div class="input-name">
                    <button type="button" class="open-btn" data-bs-toggle="modal" data-bs-target="#submit-modal">
                        <span>Open Form</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
